services:
  postgres:
    image: postgres:16-alpine
    container_name: mypes-vinto-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: mypes_vinto_dev
      POSTGRES_USER: mypes_local
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the root .env file}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mypes_local -d mypes_vinto_dev"]
      interval: 3s
      timeout: 3s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      HOST: 0.0.0.0
      PORT: 3000
      DATABASE_URL: postgres://mypes_local:${POSTGRES_PASSWORD}@postgres:5432/mypes_vinto_dev
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in the root .env file}
      ASR_PROVIDER: ${ASR_PROVIDER:-simulated}
      GOOGLE_ASR_API_KEY: ${GOOGLE_ASR_API_KEY:-}
      GOOGLE_ASR_LANGUAGE: ${GOOGLE_ASR_LANGUAGE:-es-ES}
      OPENAI_ASR_API_KEY: ${OPENAI_ASR_API_KEY:-}
      OPENAI_ASR_BASE_URL: ${OPENAI_ASR_BASE_URL:-https://api.openai.com/v1}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash-lite}
      QUECHUA_ASR_API_URL: ${QUECHUA_ASR_API_URL:-http://quechua-asr:8000/transcribe}
      QUECHUA_ASR_API_TOKEN: ${QUECHUA_ASR_API_TOKEN:-}
      ANDROID_UPDATE_VERSION_CODE: ${ANDROID_UPDATE_VERSION_CODE:-0}
      ANDROID_UPDATE_VERSION_NAME: ${ANDROID_UPDATE_VERSION_NAME:-}
      ANDROID_UPDATE_APK_PATH: ${ANDROID_UPDATE_APK_PATH:-/updates/app-debug.apk}
      ANDROID_UPDATE_BASE_URL: ${ANDROID_UPDATE_BASE_URL:-http://10.0.2.2:3000}
    ports:
      - "${API_BIND_ADDRESS:-127.0.0.1}:3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./mobile/app/build/outputs/apk/debug:/updates:ro
  quechua-asr:
    profiles:
      - quechua
    build:
      context: ./quechua-asr
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      PORT: 8000
      ASR_API_TOKEN: ${QUECHUA_ASR_API_TOKEN:-}
    volumes:
      - quechua_asr_models:/data/huggingface
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10m

volumes:
  postgres_data:
  quechua_asr_models:
