<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
  <title id="title">Secuencia de autenticación JWT</title>
  <desc id="desc">Usuario y app intercambian credenciales con API y PostgreSQL; la API devuelve un JWT de quince minutos.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#192b47"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#020617" flood-opacity=".32"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#62d8c6"/>
    </marker>
    <marker id="return" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#91b9ff"/>
    </marker>
  </defs>
  <rect width="1200" height="600" rx="26" fill="url(#bg)"/>
  <text x="52" y="58" fill="#f3f7ff" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700">Inicio de sesion remoto | JWT</text>
  <text x="52" y="88" fill="#9db3cc" font-family="Segoe UI, Arial, sans-serif" font-size="15">Flujo real de POST /api/v1/auth/login · token HS256 con expiracion de 900 segundos</text>
  <g font-family="Segoe UI, Arial, sans-serif" text-anchor="middle">
    <rect x="74" y="120" width="190" height="64" rx="15" fill="#173955" stroke="#4fb7c2" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="169" y="159" fill="#ffffff" font-size="18" font-weight="700">Usuario</text>
    <rect x="350" y="120" width="190" height="64" rx="15" fill="#173955" stroke="#4fb7c2" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="445" y="159" fill="#ffffff" font-size="18" font-weight="700">App Android</text>
    <rect x="635" y="120" width="190" height="64" rx="15" fill="#293d67" stroke="#829eea" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="730" y="159" fill="#ffffff" font-size="18" font-weight="700">API Express</text>
    <rect x="930" y="120" width="190" height="64" rx="15" fill="#17434c" stroke="#61d6c6" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="1025" y="159" fill="#ffffff" font-size="18" font-weight="700">PostgreSQL</text>
  </g>
  <g stroke="#526987" stroke-width="2" stroke-dasharray="6 7">
    <path d="M169 184 V520"/>
    <path d="M445 184 V520"/>
    <path d="M730 184 V520"/>
    <path d="M1025 184 V520"/>
  </g>
  <g font-family="Segoe UI, Arial, sans-serif" font-size="14">
    <path d="M176 224 H438" stroke="#62d8c6" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="220" y="202" width="176" height="30" rx="14" fill="#102b3c"/>
    <text x="235" y="222" fill="#d9fff6">Correo y contrasena</text>
    <path d="M452 278 H722" stroke="#62d8c6" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="481" y="255" width="218" height="31" rx="14" fill="#102b3c"/>
    <text x="494" y="276" fill="#d9fff6">POST /api/v1/auth/login</text>
    <path d="M738 336 H1017" stroke="#62d8c6" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="772" y="312" width="210" height="31" rx="14" fill="#102b3c"/>
    <text x="786" y="333" fill="#d9fff6">SELECT por email normalizado</text>
    <path d="M1018 382 H746" stroke="#91b9ff" stroke-width="3" marker-end="url(#return)"/>
    <rect x="795" y="359" width="155" height="31" rx="14" fill="#1b2c4d"/>
    <text x="809" y="380" fill="#e1eaff">Identidad y hash</text>
    <rect x="646" y="415" width="168" height="56" rx="12" fill="#202e4c" stroke="#7186bd"/>
    <text x="730" y="439" fill="#ffffff" text-anchor="middle" font-weight="700">scrypt verify</text>
    <text x="730" y="459" fill="#bdcbe5" text-anchor="middle">Firma JWT HS256</text>
    <path d="M722 500 H454" stroke="#91b9ff" stroke-width="3" marker-end="url(#return)"/>
    <rect x="502" y="478" width="168" height="31" rx="14" fill="#1b2c4d"/>
    <text x="518" y="499" fill="#e1eaff">200 + accessToken</text>
    <path d="M438 542 H180" stroke="#91b9ff" stroke-width="3" marker-end="url(#return)"/>
    <text x="237" y="535" fill="#e1eaff">Sesion remota iniciada</text>
  </g>
  <text x="52" y="580" fill="#90a6c1" font-family="Segoe UI, Arial, sans-serif" font-size="13">No se almacena la contrasena en el movil. Las rutas privadas reciben el token en Authorization: Bearer.</text>
</svg>
