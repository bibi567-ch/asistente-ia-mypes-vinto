<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">Arquitectura de contenedores de MYPES Vinto</title>
  <desc id="desc">Vista del cliente Android local-first, agente Yapay, Room, API Node Express y PostgreSQL.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#152943"/>
    </linearGradient>
    <linearGradient id="mobile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#174b63"/>
      <stop offset="1" stop-color="#163250"/>
    </linearGradient>
    <linearGradient id="cloud" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#293b68"/>
      <stop offset="1" stop-color="#20314f"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#020617" flood-opacity=".35"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#61d6c6"/>
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#8bb9ff"/>
    </marker>
  </defs>
  <rect width="1200" height="560" rx="26" fill="url(#bg)"/>
  <text x="54" y="58" fill="#f3f7ff" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700">MYPES Vinto | Arquitectura de contenedores</text>
  <text x="54" y="88" fill="#9db3cc" font-family="Segoe UI, Arial, sans-serif" font-size="15">Modelo Edge-Cloud local-first · las ventas siguen disponibles sin conexión</text>
  <rect x="42" y="126" width="610" height="348" rx="22" fill="url(#mobile)" stroke="#4aa5b7" stroke-width="1.5"/>
  <text x="68" y="163" fill="#b9f4f4" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">CONTENEDOR MOVIL ANDROID</text>
  <rect x="76" y="196" width="250" height="100" rx="16" fill="#12263c" stroke="#52c5d3" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="100" y="232" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700">App Android</text>
  <text x="100" y="260" fill="#bad0df" font-family="Segoe UI, Arial, sans-serif" font-size="14">Kotlin · Jetpack Compose</text>
  <rect x="376" y="196" width="236" height="100" rx="16" fill="#203b56" stroke="#73dfc1" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="400" y="232" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700">Yapay local</text>
  <text x="400" y="260" fill="#bad0df" font-family="Segoe UI, Arial, sans-serif" font-size="14">Reglas, herramientas, confirmacion</text>
  <rect x="182" y="354" width="350" height="86" rx="16" fill="#102337" stroke="#4bbd9d" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="207" y="389" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700">Room / SQLite cifrado</text>
  <text x="207" y="416" fill="#bad0df" font-family="Segoe UI, Arial, sans-serif" font-size="14">Productos · ventas · fiados · Outbox</text>
  <rect x="700" y="126" width="458" height="348" rx="22" fill="url(#cloud)" stroke="#688ce0" stroke-width="1.5"/>
  <text x="728" y="163" fill="#d5ddff" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">CONTENEDOR SERVIDOR</text>
  <rect x="752" y="212" width="202" height="116" rx="16" fill="#192842" stroke="#8bb9ff" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="774" y="252" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700">API REST</text>
  <text x="774" y="280" fill="#c1d1ec" font-family="Segoe UI, Arial, sans-serif" font-size="14">Node.js 24 · Express</text>
  <text x="774" y="304" fill="#c1d1ec" font-family="Segoe UI, Arial, sans-serif" font-size="13">JWT · Catalogo · Sync</text>
  <rect x="992" y="212" width="136" height="116" rx="16" fill="#182c3f" stroke="#61d6c6" stroke-width="1.5" filter="url(#shadow)"/>
  <ellipse cx="1060" cy="235" rx="42" ry="12" fill="#2c6973" stroke="#61d6c6"/>
  <path d="M1018 235v55c0 7 19 13 42 13s42-6 42-13v-55" fill="#1e4656" stroke="#61d6c6" stroke-width="1.5"/>
  <ellipse cx="1060" cy="290" rx="42" ry="12" fill="#1e4656" stroke="#61d6c6"/>
  <text x="1031" y="266" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">PostgreSQL</text>
  <text x="1032" y="285" fill="#c1d1ec" font-family="Segoe UI, Arial, sans-serif" font-size="12">datos nube</text>
  <path d="M954 270 H984" stroke="#61d6c6" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M326 240 C470 146 590 146 747 238" fill="none" stroke="#61d6c6" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="461" y="150" width="170" height="31" rx="15" fill="#123545" stroke="#397e8f"/>
  <text x="480" y="171" fill="#c8f4ec" font-family="Segoe UI, Arial, sans-serif" font-size="13">REST + Bearer JWT</text>
  <path d="M752 310 C610 486 456 494 326 294" fill="none" stroke="#8bb9ff" stroke-width="2.5" stroke-dasharray="8 7" marker-end="url(#arrowBlue)"/>
  <rect x="469" y="451" width="164" height="29" rx="14" fill="#202c4c" stroke="#536da8"/>
  <text x="491" y="471" fill="#d9e3ff" font-family="Segoe UI, Arial, sans-serif" font-size="13">SSE por negocio</text>
  <path d="M201 298 V344" stroke="#61d6c6" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M494 298 C495 321 476 335 456 350" fill="none" stroke="#73dfc1" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="55" y="526" fill="#90a6c1" font-family="Segoe UI, Arial, sans-serif" font-size="13">Yapay no invoca un LLM remoto. SSE es una capacidad backend en memoria; la sincronizacion movil principal usa REST y Outbox.</text>
</svg>
